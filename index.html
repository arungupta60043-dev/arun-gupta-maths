*{
  box-sizing:border-box;
  scroll-behavior:smooth;

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7ff;
  color:#172033;
  transition:.3s;
}

/* HEADER */

header{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:40px 20px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed,#ec4899);
  position:relative;
  overflow:hidden;
}

header:before,
header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#ffffff22;
  animation:float 6s infinite ease-in-out;
}

header:before{
  width:250px;
  height:250px;
  top:-80px;
  left:-80px;
}

header:after{
  width:300px;
  height:300px;
  bottom:-120px;
  right:-100px;
  animation-delay:2s;
}

.hero{
  position:relative;
  z-index:2;
}

.logo{
  font-size:90px;
  animation:bounce 2s infinite;
}

header h1{
  font-size:48px;
  margin:10px 0;
  letter-spacing:2px;
}

header p{
  font-size:20px;
  margin:10px;
}

.badge{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  border-radius:30px;
  background:#ffffff22;
  border:1px solid #ffffff55;
}
